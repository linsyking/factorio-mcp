[project]
name = "factorio-mcp"
version = "0.1.0"
description = "Policy-free MCP server that lets one AI agent control one Factorio character, fairly (no cheats), over RCON"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.20",
]

[project.scripts]
factorio-mcp = "factorio_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factorio_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
