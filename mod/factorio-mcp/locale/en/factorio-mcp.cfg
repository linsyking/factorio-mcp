[mod-name]
factorio-mcp=Factorio MCP

[mod-description]
factorio-mcp=Game side of factorio-mcp: AI agents each control one character over RCON, using only normal player mechanics.

[mod-setting-name]
factorio-mcp-max-characters=Max agent characters
factorio-mcp-chart-radius=Agent exploration radius (chunks)
factorio-mcp-view-radius=Agent view radius (tiles)
factorio-mcp-explore-radius=Max walk into unexplored land (tiles)
factorio-mcp-start-area=Starting map area around spawn (tiles)
factorio-mcp-pathfinder-budget=Pathfinder work per tick (× vanilla)

[mod-setting-description]
factorio-mcp-max-characters=How many agent characters may exist at once.
factorio-mcp-chart-radius=Chunks around each agent character that count as explored (2 = 5x5 chunks, like a player).
factorio-mcp-view-radius=Distance within which agents see live details of other forces (enemies).
factorio-mcp-explore-radius=How far past explored ground a walk goal may be.
factorio-mcp-pathfinder-budget=The engine pathfinder expands 1000 nodes per tick by default, shared by every character and biter; several agents asking for long paths at once then wait many seconds. This multiplies the per-tick budget (1 = vanilla). Changes map settings.
factorio-mcp-start-area=Agents start knowing this many tiles around the spawn point, like the area freeplay charts for a new player (0 = off).
